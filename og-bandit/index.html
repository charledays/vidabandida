<style>
  /* Layout: product-shot stage (the toy on studio grey) + a tight spec panel, stacked on phones. */
  :root {
    --bg: #cfd0cc;          /* studio sweep grey, like the reference sheet */
    --stage: #d9dad6;
    --panel: #ecece8;
    --ink: #141414;
    --muted: #61625e;
    --line: rgba(20, 20, 20, 0.14);
    --font-ui: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 15px;
    padding-inline: 16px;
    padding-block: 12px 20px;
  }
  .wrap { max-width: 1180px; margin-inline: auto; display: grid; gap: 12px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .wordmark { margin: 0; width: clamp(150px, 30vw, 230px); aspect-ratio: 1200 / 221; background: var(--ink);
    -webkit-mask: url("vb-logo.png") left center / contain no-repeat; mask: url("vb-logo.png") left center / contain no-repeat; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .meta { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .meta b { color: var(--ink); font-weight: 700; }

  .studio { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  @media (max-width: 820px) { .studio { grid-template-columns: minmax(0, 1fr); } }

  .stage { position: relative; background: radial-gradient(120% 90% at 50% 35%, var(--stage), var(--bg)); border-radius: 6px; aspect-ratio: 4 / 5; max-height: 78vh; width: 100%; max-width: 100%; overflow: hidden; }
  @media (max-width: 820px) { .stage { aspect-ratio: 1 / 1.05; max-height: 62vh; } }
  .stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .stage .hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
  .stage .status { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .panel { background: var(--panel); border-radius: 6px; padding: 14px; display: grid; gap: 14px; min-width: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border-bottom: 1px solid var(--line); }
  .tab { appearance: none; border: 0; background: none; font: 600 13px/1 var(--font-ui); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 10px 10px 11px; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab:focus-visible, .sw:focus-visible, .btn:focus-visible, .opt:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .group { display: grid; gap: 10px; }
  .label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .label code { font-family: var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--ink); }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .sw { appearance: none; border: 1px solid var(--line); background: #fff0; border-radius: 4px; padding: 6px; display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 8px; text-align: left; font: 500 13px/1.15 var(--font-ui); color: var(--ink); cursor: pointer; min-width: 0; }
  .sw .chip { width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(0,0,0,.22); }
  .sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .custom { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .custom input[type=color] { width: 40px; height: 30px; border: 1px solid var(--line); border-radius: 4px; padding: 2px; background: none; cursor: pointer; }

  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { appearance: none; border: 1px solid var(--line); background: none; border-radius: 4px; padding: 10px; font: 600 13px/1.1 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); cursor: pointer; text-align: left; }
  .opt small { display: block; font: 400 11px/1.3 var(--font-ui); letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 4px; }
  .opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .upload { font-size: 13px; display: grid; gap: 6px; }
  .upload input { font: inherit; font-size: 12px; max-width: 100%; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--panel); border-radius: 4px; padding: 10px 14px; font: 600 12px/1 var(--font-ui); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; }
  .btn.ghost { background: none; color: var(--ink); }

  .spec { border-top: 1px solid var(--line); padding-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .spec dt { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); align-self: center; }
  .spec dd { margin: 0; font-weight: 600; min-width: 0; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; max-width: 62ch; margin: 0; }
  .product { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .product > div { display: grid; gap: 2px; min-width: 0; }
  .product-kicker { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .product b { font-size: 16px; line-height: 1.15; }
  #product-price { font-size: 13px; color: var(--muted); }
  .btn.buy { text-decoration: none; white-space: nowrap; padding: 12px 18px; }
  @media (max-width: 820px) {
    body { padding-block: 8px 16px; }
    .stage { aspect-ratio: auto; height: 37svh; max-height: none; }
    .stage .hint { display: none; }
    .panel { padding: 12px; gap: 10px; }
    .tabs { flex-wrap: nowrap; justify-content: space-between; }
    .tab { padding: 8px 2px 9px; font-size: 11px; letter-spacing: 0.04em; }
    .actions .btn { padding: 9px 12px; font-size: 11px; }
    .swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .sw { padding: 5px; font-size: 12px; grid-template-columns: 18px 1fr; }
    .sw .chip { width: 18px; height: 18px; }
    .opts { grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; }
    .opt { padding: 7px 8px; font-size: 11px; }
    .opt small { display: none; }
    .group { gap: 6px; }
    .label { font-size: 10px; }
    .spec, .note { display: none; }
    /* every option on one line: label, then small chips; colours as dots */
    .group.row { grid-template-columns: 76px minmax(0, 1fr); align-items: center; gap: 6px; }
    .group.row .label code, .group.row .custom { display: none; }
    .group.row .opts, .group.row .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
    .group.row .opt { padding: 6px 7px; font-size: 10px; letter-spacing: 0.03em; }
    .group.row .sw { padding: 3px; grid-template-columns: 20px; border-radius: 50%; }
    .group.row .sw .chip { width: 20px; height: 20px; }
    .group.row .sw span:last-child { display: none; }
    .upload { font-size: 11px; }
    #panes > .group { gap: 8px !important; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1 class="wordmark"><span class="sr">vidabandida</span></h1>
    <div class="meta"><span><b>OG BANDIT</b></span><span>Vestidor</span></div>
  </header>

  <section class="studio">
    <div class="stage" id="stage">
      <div class="status" id="status">Cargando el OG Bandit…</div>
      <span class="hint">Arrastra para girar · pellizca para acercar</span>
    </div>

    <div class="panel">
      <div class="product">
        <div><span class="product-kicker">Camiseta</span><b id="product-name"></b><span id="product-price">S/ 100</span></div>
        <a class="btn buy" id="buy" href="/">Comprar</a>
      </div>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panes"></div>

      <dl class="spec" id="spec"></dl>

      <div class="actions">
        <button class="btn" id="random" type="button">Combinación al azar</button>
        <button class="btn ghost" id="reset" type="button">Volver al original</button>
      </div>
      <p class="note">Las camisetas son decoloradas a mano, una a una: cada pieza es única. Short, zapatillas y accesorios son para jugar con el look.</p>
    </div>
  </section>
</div>

const LOGOS = [["wordmark","vidabandida","Frente y espalda oficiales, de manga a manga"],["none","Sin logo","Camiseta lisa"],["upload","Tu logo","Sube un PNG para probar"]];
// accessory slots: [state key, label, options [id, name, hint]]

  ["hat", "Cabeza", [["none","Nada",""],["cap","Gorra","Con isotipo"],["beanie","Beanie","Con isotipo"],["crown","Corona","Dorada"]]],
  ["eyes", "Ojos", [["none","Nada",""],["sun","Sol","","Lentes de sol"],["ski","Ski","","Lentes de ski"]]],
  ["phones", "Audífonos", [["none","Nada",""],["black","Negros","","Audífonos negros"],["silver","Plateados","","Audífonos plateados"]]],
  ["clava", "Cara", [["none","Nada",""],["on","Balaclava","Negra"]]],
  ["chain", "Cuello", [["none","Nada",""],["gold","Oro","","Cadena de oro"],["silver","Plata","","Cadena de plata"]]],
  ["watch", "Muñeca", [["none","Nada",""],["gold","Oro","","Reloj de oro"],["silver","Plata","","Reloj de plata"]]],

const DEFAULT = { tee:"#1b262c", shorts:"#19191b", shoes:"#e2dccd", logo:"wordmark", logoColor:"#9a928a", hat:"none", eyes:"none", phones:"none", clava:"none", chain:"none", watch:"none", accColor:"#1b262c", isoColor:"#9a928a", lensColor:"#ff7a1a", skiColor:"#f7a11d" };
let state = { ...DEFAULT };
let uploadedImage = null;
const art = {};

  const img = new Image(); img.onload = () => { art[k] = img; ok(); }; img.onerror = ok; img.src = `vb-${k}.png`;
})));

  g.globalCompositeOperation = "source-over"; return c;

// ---------- UI ----------

const tabsEl = document.getElementById("tabs"), panesEl = document.getElementById("panes");

  const box = g.querySelector(".swatches");

const parts = {};                                   // material name -> meshes (the model ships as separate pieces)

const headTargets = [], chestTargets = [];
let mixer = null, current = null; const moves = {}, bones = {}, skinned = [], clock = new THREE.Clock();

// the model ships as base64 inside JSON (the host serves .json, not .glb)
async function loadModel() {
  // a real web server serves the .glb straight (lighter); the artifact host only serves .json, so fall back to it
  try {
    const r = await fetch("og-bandit.glb");
    if (r.ok && !(r.headers.get("content-type") ?? "").includes("html")) {
      const buf = await r.arrayBuffer();
      return await new Promise((ok, fail) => new GLTFLoader().parse(buf, "", ok, fail));
    }
  } catch { /* no .glb here */ }
  const res = await fetch("og-bandit-web.json");
  if (!res.ok) throw new Error(res.status);
  const { glb } = await res.json();
  const bin = Uint8Array.from(atob(glb), ch => ch.charCodeAt(0));
  return new Promise((ok, fail) => new GLTFLoader().parse(bin.buffer, "", ok, fail));
}
loadModel().then(gltf => {
  const root = gltf.scene;
  root.traverse(o => {
    if (o.isMesh) {
      const n = o.material.name; o.material = vinyl(n, o.material); o.castShadow = o.receiveShadow = true;
      (parts[n] ??= []).push(o);
      const big = (cur) => !cur || o.geometry.attributes.position.count > cur.geometry.attributes.position.count;
      if (n === "VB_TEE" && big(teeMesh)) teeMesh = o;                     // the main shirt surface (prints go on it)
      if (n === "VB_PANDA_WHITE" && big(whiteMesh)) whiteMesh = o;
    }
  });
  scene.add(root); root.updateMatrixWorld(true); modelRoot = root;
  // head measured on the model (the crown of the head anchors the hats; the ball centre the glasses and the cap)
  const hb = new THREE.Box3().setFromObject(whiteMesh);
  anchor.set((hb.min.x + hb.max.x) / 2, hb.max.y, HEAD.z - 0.04); HEAD.y = hb.max.y - 2.39; EYE_Y = HEAD.y - 0.05; NECK_Y = hb.min.y + 0.15;
  root.traverse(o => { if (o.isSkinnedMesh) skinned.push(o); if (o.isBone) bones[o.name.replace(/[^A-Za-z]/g, "")] = o; });
  for (const n of ["VB_PANDA_WHITE", "VB_EARS", "VB_EYE_PATCH", "VB_EYE_WHITE", "VB_NOSE", "VB_FISTS"]) headTargets.push(...(parts[n] ?? []));
  // the shirt is skinned (slow to ray-test): the chain is fitted against a still copy of it at rest
  for (const m of parts.VB_TEE ?? []) {
    const probe = new THREE.Mesh(m.geometry); probe.matrixAutoUpdate = false; probe.matrixWorld.copy(m.matrixWorld);
    chestTargets.push(probe);
  }
  chestTargets.push(...headTargets);
  for (const m of chestTargets) m.geometry.computeBoundsTree();
  mixer = new THREE.AnimationMixer(root);
  for (const clip of gltf.animations) moves[clip.name] = mixer.clipAction(clip);
  statusEl.remove(); resize(); apply();
}).catch(() => { statusEl.textContent = "No se pudo cargar el modelo. Recarga la página."; });

// shirt prints: decals projected onto the tee only (front lettering + back arch, sleeve to sleeve)
function chlorotypeWear(g, w, h, seed) {
  // Chlorotype bleach print: speckle the ink and fade it slightly toward the sleeves
  g.globalCompositeOperation = "destination-out";
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 5200; i++) {
    g.globalAlpha = 0.25 + rnd() * 0.6;
    g.beginPath(); g.arc(rnd() * w, rnd() * h, 0.6 + rnd() * 2.2, 0, Math.PI * 2); g.fill();

  fade.addColorStop(0, "rgba(0,0,0,0.35)"); fade.addColorStop(0.25, "rgba(0,0,0,0)");
  fade.addColorStop(0.75, "rgba(0,0,0,0)"); fade.addColorStop(1, "rgba(0,0,0,0.35)");
  g.globalAlpha = 1; g.fillStyle = fade; g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = "source-over";
}
function printTexture(img, color, wear) {

  c.width = 2048; c.height = Math.round(2048 * img.height / img.width);
  const g = c.getContext("2d");
  if (color) g.drawImage(tinted(img, color, c.width, c.height), 0, 0);
  else g.drawImage(img, 0, 0, c.width, c.height);
  if (wear) chlorotypeWear(g, c.width, c.height, wear);

}
function addPrint(img, color, wear, side, span, maxH) {

  const y = 5.05;
  const hit = new THREE.Raycaster(new THREE.Vector3(0, y, 30 * side), new THREE.Vector3(0, 0, -side)).intersectObject(teeMesh, false)[0];
  const p = hit ? hit.point : new THREE.Vector3(0, y, 1.6 * side);
  const helper = new THREE.Object3D(); helper.position.copy(p); helper.lookAt(p.clone().add(new THREE.Vector3(0, 0, side)));

    depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 });
  // the shirt and its sleeves are separate pieces: the print lands on each (sleeve to sleeve), riding its own bones
  for (const piece of parts.VB_TEE ?? []) {
    const geo = facingOnly(new DecalGeometry(piece, p, helper.rotation, new THREE.Vector3(w, h, 3.4)), side);  // shallow: never wraps to the other side
    if (!geo.attributes.position.count) { geo.dispose(); continue; }

    if (art.back) addPrint(art.back, state.logoColor, 11, -1, 6.1, 2.2);         // back: narrower so the first and last letters stay on the flat of the back

function buildHat(g) {
  const top = anchor.y;
  if (state.hat === "beanie") {
    const dome = new THREE.Mesh(new THREE.SphereGeometry(2.25, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), accMat);
    dome.scale.set(1.05, 0.95, 1.02); dome.position.set(0, top - 1.15, anchor.z + 0.1);
    // ribbed cuff
    const cuffGeo = new THREE.CylinderGeometry(2.42, 2.42, 0.62, 96, 1, true);
    const cp = cuffGeo.attributes.position;
    for (let i = 0; i < cp.count; i++) {
      const a = Math.atan2(cp.getX(i), cp.getZ(i)), r = 1 + 0.025 * Math.cos(a * 48);
      cp.setXYZ(i, cp.getX(i) * r, cp.getY(i), cp.getZ(i) * r);
    }
    cuffGeo.computeVertexNormals();
    const cuff = new THREE.Mesh(cuffGeo, knitMat); cuff.position.set(0, top - 0.95, anchor.z + 0.12);
    const pom = new THREE.Mesh(new THREE.IcosahedronGeometry(0.55, 3), accMat); pom.position.set(0, top + 1.05, anchor.z + 0.1);
    g.add(dome, cuff, pom);
    addIsotype(g, dome, top - 0.2, 1.0);
  } else if (state.hat === "cap") {
    // crown: a slightly larger copy of the head ball, cut just above the brow and lower at the back,
    // so it sits down on the head (the ears come out through it)
    const C = new THREE.Vector3(HEAD.x, HEAD.y, HEAD.z);
    const edge = (th) => 0.42 - 0.36 * (1 - Math.cos(th)) / 2;              // elevation of the band, radians
    const crownPt = (th, t) => {
      const ph = edge(th) + (Math.PI / 2 - 0.002 - edge(th)) * t;
      const d = new THREE.Vector3(Math.cos(ph) * Math.sin(th), Math.sin(ph), Math.cos(ph) * Math.cos(th));
      const p = C.clone().addScaledVector(d, 1.07 / Math.hypot(d.x / HEAD.rx, d.y / HEAD.ry, d.z / HEAD.rz) + 0.05);
      p.y = C.y + (p.y - C.y) * (1 + 0.16 * t);                            // a taller, structured crown
      return p;
    };

    const crown = new THREE.Mesh(gridGeo(120, 28, (u, v) => crownPt(u * 2 * Math.PI, v)), capMat);
    const button = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 10), accMat);
    button.position.copy(crownPt(0, 1)).y -= 0.06;
    // rolled inner band hides the cut edge
    const rim = [];
    for (let i = 0; i < 120; i++) rim.push(crownPt(i / 120 * 2 * Math.PI, 0));
    const band = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rim, true), 240, 0.06, 8, true), accMat);
    // brim: D-shaped, longest at the centre and meeting the crown at the sides, pitched down with curved sides
    const thB = 1.25;
    const brimPt = (u, s, under) => {
      const th = (u * 2 - 1) * thB;
      const e = crownPt(th, 0).lerp(C, 0.03);
      const reach = 1.85 * Math.pow(Math.max(0, Math.cos(th / thB * Math.PI / 2)), 0.6);
      const p = e.addScaledVector(new THREE.Vector3(Math.sin(th) * 0.4, 0, Math.cos(th)).normalize(), reach * s);
      p.y -= reach * s * 0.2 + 0.46 * (Math.sin(th) / Math.sin(thB)) ** 2 * s + (under ? 0.1 : 0);
      return p;

    brim.add(new THREE.Mesh(gridGeo(64, 12, (u, v) => brimPt(u, v, false)), brimMat),
             new THREE.Mesh(gridGeo(64, 12, (u, v) => brimPt(u, v, true)), brimMat),
             new THREE.Mesh(gridGeo(64, 1, (u, v) => brimPt(u, 1, v > 0.5)), brimMat));
    g.add(crown, button, band, brim);
    addIsotype(g, crown, top - 0.42, 0.95);
  } else if (state.hat === "crown") {
    // band with five spikes, a ball on each tip and a diamond stud between them
    const H = 0.95, geo = new THREE.CylinderGeometry(2.05, 1.85, H, 120, 8, true);
    const pp = geo.attributes.position;
    for (let i = 0; i < pp.count; i++) {
      const y = pp.getY(i), a = Math.atan2(pp.getX(i), pp.getZ(i));
      const spike = Math.pow((Math.cos(5 * a) + 1) / 2, 3);
      pp.setY(i, y + spike * 0.75 * (y + H / 2) / H);
    }

    for (let k = 0; k < 5; k++) {
      const a = k * 2 * Math.PI / 5;
      const ball = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 16), gold);
      ball.position.set(Math.sin(a) * 2.07, H / 2 + 0.78, Math.cos(a) * 2.07); crown.add(ball);
      const stud = new THREE.Mesh(new THREE.OctahedronGeometry(0.2), gold);

}

function buildEyes(g) {

    const frame = new THREE.MeshPhysicalMaterial({ color: 0x0e0e10, roughness: 0.3, clearcoat: 0.9, clearcoatRoughness: 0.18, side: THREE.DoubleSide });

  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const u = x / N, v = y / N, n = n1(u, v) * 0.55 + n2(u, v) * 0.3 + n3(u, v) * 0.15;
    const cloud = sm(0.5, 0.78, n), dark = 1 - sm(0.22, 0.46, n);
    const f = 1 + w.blotch * (cloud - 0.35 * dark) + (n4(u, v) - 0.5) * 0.07 + (rnd() - 0.5) * 0.1;
    const k = cloud * w.blotch * 0.6, i = (y * N + x) * 4;                // bleach also warms the colour toward cream
    d[i] = (r0 * f) * (1 - k) + cream[0] * k; d[i + 1] = (g0 * f) * (1 - k) + cream[1] * k; d[i + 2] = (b0 * f) * (1 - k) + cream[2] * k; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  for (let k = 0; k < w.dots; k++) {                                       // bleach specks, wrapped across the tile edges
    const x = rnd() * N, y = rnd() * N, r = rnd() < 0.1 ? 3 + rnd() * 2 : 1.2 + rnd() * 1.6;
    g.fillStyle = `rgba(${cream.join(",")},${(0.5 + rnd() * 0.45).toFixed(2)})`;
    for (const dx of [-N, 0, N]) for (const dy of [-N, 0, N]) {
      if (x + dx < -4 || x + dx > N + 4 || y + dy < -4 || y + dy > N + 4) continue;
      g.beginPath(); g.arc(x + dx, y + dy, r, 0, Math.PI * 2); g.fill();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 4;
  return (washCache[hex] = tex);
}

// ---------- movements ----------
const MOVES = { idle: ["MOV_1_IDLE", true], dance: ["MOV_3_BAILE", true],
  briefcase: ["MOV_4_MALETIN", true], pose: ["MOV_5_POSE", false] };
function atRest(fn) {
  // the accessories and prints are fitted to the toy standing still, then the movement carries on
  const time = current?.time ?? 0, playing = current;
  mixer?.stopAllAction(); for (const s of skinned) s.skeleton.pose();
  modelRoot?.updateMatrixWorld(true);
  fn();
  if (playing) { playing.reset().play(); playing.time = time; }
}
function playMove(id) {
  if (!mixer) return;
  const [name, loop] = MOVES[id] ?? [];
  const next = moves[name];
  if (current && current !== next) current.fadeOut(0.35);
  current = next ?? null;
  if (!next) { if (!id || id === "none") setTimeout(() => { if (!current) { mixer.stopAllAction(); for (const s of skinned) s.skeleton.pose(); } }, 360); return; }
  next.reset(); next.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity); next.clampWhenFinished = !loop;
  next.fadeIn(0.35).play();
}
// The toy always comes back to the idle with flow. Every so often, and each time the shirt colour changes,
// it breaks into one of its moves (in turn: bandit pose, dance, briefcase idle) and then settles back.
const SPECIALS = [["pose", 4.5], ["dance", 4.2], ["briefcase", 7.0]];   // [move, seconds before going back to the idle]
const IDLE_GAP = 10;                                                    // seconds of idle between moves
const STILL = matchMedia("(prefers-reduced-motion: reduce)").matches;
let turn = 0, moveTimer = null;
function toIdle() {
  playMove("idle"); clearTimeout(moveTimer);
  moveTimer = setTimeout(showMove, IDLE_GAP * 1000);
}
function showMove() {
  if (STILL || !mixer) return;
  const [id, secs] = SPECIALS[turn++ % SPECIALS.length];
  playMove(id); clearTimeout(moveTimer);
  moveTimer = setTimeout(toIdle, secs * 1000);
}

let lastDecal = null, uploadVersion = 0;
const decalSig = () => [state.logo, state.logoColor, uploadVersion, teeMesh ? 1 : 0].join("|");
function apply() {
  for (const [name, key] of [["VB_SHORTS", "shorts"], ["VB_SHOES", "shoes"]])
    for (const m of parts[name] ?? []) if (!m.material.userData.painted) m.material.color.set(state[key]);
  // the shirt: its colorway's hand-bleached wash on top of the colour (the black one stays plain)
  const wash = WASH[state.tee.toLowerCase()] ? washTexture(state.tee.toLowerCase()) : null;
  washUniforms.washOn.value = wash ? 1 : 0;
  if (wash) washUniforms.washMap.value = wash;
  for (const m of parts.VB_TEE ?? []) if (!m.material.userData.painted) m.material.color.set(wash ? 0xffffff : state.tee);
  accMat.color.set(state.accColor); knitMat.color.set(state.accColor);
  artReady.then(() => {
    const slots = staleSlots(), dSig = decalSig();
    if (slots.length || dSig !== lastDecal) atRest(() => {
      slots.forEach(rebuildSlot);
      if (dSig !== lastDecal) { updateDecal(); lastDecal = dSig; }
    });
    if (!current && !STILL) toIdle();                                       // starts once the model is in
  });
}

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  const offset = camera.position.clone().sub(controls.target);
  offset.setLength(r.width / r.height < 1.05 ? 31 : 25);
  camera.position.copy(controls.target).add(offset);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
renderer.setAnimationLoop(() => { mixer?.update(Math.min(clock.getDelta(), 0.1)); controls.update(); renderer.render(scene, camera); });
</script>
